<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <title>けやき祭クイズ 管理画面</title>
    <link rel="stylesheet" href="/admin/style.css">
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/admin/script.js" defer></script>
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">KEYAKI FESTIVAL</p>
          <h1>クイズ管理画面</h1>
        </div>
        <p id="server-status" class="server-status" data-connected="false" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          接続中…
        </p>
      </header>

      <section id="player-grid" class="player-grid" aria-live="polite">
        <p class="loading-message">回答PCの状態を読み込んでいます…</p>
      </section>
    </main>
  </body>
</html>
